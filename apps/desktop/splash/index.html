<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inertia</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08090c;
        color: #f0f0f0;
        font-family: system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #888;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Inertia</h1>
      <p id="status">Starting local API...</p>
    </main>
    <script>
      (function () {
        var origin = "http://127.0.0.1:4783";
        var statusEl = document.getElementById("status");
        var started = Date.now();
        var timeoutMs = 45000;

        function go(url) {
          window.location.replace(url);
        }

        function tick() {
          if (Date.now() - started > timeoutMs) {
            if (statusEl) {
              statusEl.textContent = "Local API did not start. Restart the app.";
            }
            return;
          }
          fetch(origin + "/api/health", { cache: "no-store" })
            .then(function (resp) {
              if (!resp.ok) {
                throw new Error("unhealthy");
              }
              go(origin + "/");
            })
            .catch(function () {
              setTimeout(tick, 200);
            });
        }

        tick();
      })();
    </script>
  </body>
</html>
